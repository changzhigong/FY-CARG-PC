<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调拨单打印预览</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        .print-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .print-header h2 {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .print-controls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        
        .print-page {
            margin: 20px auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 210mm;
        }
        
        .print-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 14px;
        }
        
        .print-table th,
        .print-table td {
            border: 1px solid #000;
            padding: 5px;
            text-align: center;
            vertical-align: middle;
        }
        
        .print-table th {
            background-color: #f5f7fa;
            font-weight: bold;
        }
        
        .header-info {
            margin-bottom: 20px;
        }
        
        .header-info table {
            width: 100%;
            font-size: 14px;
        }
        
        .summary-row {
            font-weight: bold;
            background-color: #f0f9eb;
        }

/* 打印样式 */
@media print {
  body {
    margin: 0;
    padding: 0;
    font-size: 12pt;
  }
  
  .print-controls {
    display: none !important;
  }
  
  .print-page {
    page-break-after: always;
    margin: 0;
    padding: 10mm;
    box-shadow: none !important;
  }
  
  .print-table {
    font-size: 10pt;
  }
  
  .print-header h2 {
    font-size: 16pt;
    margin-bottom: 10mm;
  }
}

/* 屏幕预览样式 */
@media screen {
  .print-page {
    margin: 20px auto;
    padding: 20px;
    background: white;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    max-width: 210mm;
    min-height: 297mm;
  }
}

/* 通用样式 */
.print-header {
  text-align: center;
  margin-bottom: 20px;
  border-bottom: 2px solid #000;
  padding-bottom: 10px;
}

.print-header h2 {
  font-size: 24px;
  font-weight: bold;
  margin: 10px 0;
  color: #333;
}

.info-table {
  width: 100%;
  font-size: 14px;
  margin-bottom: 20px;
  border-collapse: collapse;
}

.info-table td {
  padding: 5px 10px;
  vertical-align: top;
}

.print-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 12px;
  border: 1px solid #000;
}

.print-table th,
.print-table td {
  border: 1px solid #000;
  padding: 8px 5px;
  text-align: center;
  vertical-align: middle;
}

.print-table th {
  background-color: #f5f7fa;
  font-weight: bold;
  color: #333;
}

.print-table tbody tr:nth-child(even) {
  background-color: #f9f9f9;
}

.print-table td {
  word-break: break-word;
  overflow-wrap: break-word;
}

.print-footer {
  margin-top: 30px;
  font-size: 12px;
  color: #666;
  border-top: 1px dashed #ccc;
  padding-top: 10px;
}

.summary-row {
  font-weight: bold;
  background-color: #e8f4fd;
}

.summary-row td {
  border-top: 2px solid #000 !important;
}

.print-controls {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 1000;
  background: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  border: 1px solid #dcdfe6;
}

.print-controls label {
  font-weight: bold;
  margin-right: 10px;
  color: #606266;
}

/* 按钮样式 - 替代Element UI */
.el-button {
  display: inline-block;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  background: #fff;
  border: 1px solid #dcdfe6;
  color: #606266;
  text-align: center;
  box-sizing: border-box;
  outline: none;
  margin: 0;
  transition: .1s;
  font-weight: 500;
  padding: 12px 20px;
  font-size: 14px;
  border-radius: 4px;
  margin-left: 10px;
  min-width: 80px;
}

.el-button:hover {
  color: #409eff;
  border-color: #c6e2ff;
  background-color: #ecf5ff;
}

.el-button--primary {
  color: #fff;
  background-color: #409eff;
  border-color: #409eff;
}

.el-button--primary:hover {
  background: #66b1ff;
  border-color: #66b1ff;
  color: #fff;
}

/* 选择框样式 - 替代Element UI */
.el-select {
  display: inline-block;
  position: relative;
}

.el-select select {
  background-color: #fff;
  border-radius: 4px;
  border: 1px solid #dcdfe6;
  box-sizing: border-box;
  color: #606266;
  font-size: inherit;
  height: 40px;
  line-height: 40px;
  outline: none;
  padding: 0 15px;
  width: 100%;
}
    </style>
    </head>
    
    <body>
      <div class="print-controls">
        <div style="margin-bottom: 10px;">
          <label style="margin-right: 10px;">选择打印机:</label>
          <select id="printer-select" class="el-select">
            <option value="">正在获取打印机...</option>
          </select>
        </div>
        <div>
          <button id="btn-close" class="el-button">返回</button>
          <button id="btn-print" class="el-button el-button--primary">打印</button>
        </div>
      </div>
    
      <div id="print-content"></div>
      <!-- 引用本地脚本 -->
      <script src="clodop-local.js"></script>    
      <!--<script src="print-preview.js"></script>-->
    </body>
    
    </html>
